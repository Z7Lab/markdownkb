name: docmap
display_name: Doc Map
description: Interactive 3D document similarity visualization with clustering and word clouds.
version: 1.0.0
author: mdkb
icon: network
category: visualization
feature_flag: docmap
requires: []

endpoints:
  - method: GET
    path: /api/docmap/data
    description: Compute document similarity map (nodes, edges, clusters, word clouds)
  - method: GET
    path: /api/docmap/stats
    description: Doc map statistics (doc count, chunk count)
  - method: GET
    path: /api/docmap/status
    description: Check if cached doc map data is available
  - method: GET
    path: /api/docmap/edge-detail
    description: Chunk-level similarity detail for a document pair
  - method: GET
    path: /api/docmap/progress
    description: Current doc map computation progress

config: {}
