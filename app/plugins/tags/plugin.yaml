name: tags
display_name: Tags
description: Tag storage, CRUD, folder-based auto-tagging, and optional AI-powered tag generation.
version: 1.0.0
author: mdkb
icon: tags
category: core
feature_flag: tags
requires: []

endpoints:
  - method: GET
    path: /api/tags
    description: List unique tags (paginated)
  - method: PUT
    path: /api/files/tags
    description: Update tags on a file
  - method: PUT
    path: /api/files/bulk-tags
    description: Bulk update tags (add/remove/replace)
  - method: POST
    path: /api/files/auto-tag-preview
    description: Preview auto-tag assignments by folder pattern
  - method: POST
    path: /api/files/auto-tag-apply
    description: Apply auto-tag assignments from preview
  - method: POST
    path: /api/tags/generate
    description: Generate AI tags for a markdown file (requires LLM)
  - method: POST
    path: /api/tags/apply
    description: Apply tags to a file's frontmatter
  - method: POST
    path: /api/tags/bulk
    description: Bulk-tag files in a directory

config:
  ai_generation:
    type: boolean
    default: false
    label: AI Tag Generation
    description: Enable LLM-powered tag generation for documents
