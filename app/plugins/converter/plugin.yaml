name: converter
display_name: File Converter
description: Batch convert documents (DOCX, PDF, HTML, etc.) to markdown using Pandoc. Save to watched directories or buckets for indexing.
version: 1.0.0
author: mdkb
icon: file-edit
category: integration
feature_flag: converter
requires: []

# System binaries this plugin needs. Checked at runtime — the UI shows
# a warning when any are missing.
system_dependencies:
  - name: pandoc
    binary: pandoc
    required: true
    install_hint: "apt install pandoc (or brew install pandoc on macOS)"
  - name: pdftotext
    binary: pdftotext
    required: false
    install_hint: "apt install poppler-utils (optional, improves PDF conversion)"

endpoints:
  - method: GET
    path: /api/converter/formats
    description: List supported input formats
  - method: POST
    path: /api/converter/convert
    description: Start batch conversion of files in a directory
  - method: GET
    path: /api/converter/status
    description: Current conversion progress
  - method: POST
    path: /api/converter/cancel
    description: Cancel running conversion

config: {}
