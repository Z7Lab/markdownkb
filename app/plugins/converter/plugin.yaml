name: converter
display_name: File Converter
description: Batch convert documents (DOCX, PDF, PPTX, XLSX, HTML, EPUB, CSV, etc.) to markdown using Microsoft's markitdown library. No system dependencies required.
version: 2.0.0
author: markdownkb
icon: file-edit
category: integration
feature_flag: converter
requires: []

endpoints:
  - method: GET
    path: /api/converter/formats
    description: List supported input formats
  - method: POST
    path: /api/converter/convert
    description: Start batch conversion of files in a directory
  - method: GET
    path: /api/converter/status
    description: Current conversion progress
  - method: POST
    path: /api/converter/cancel
    description: Cancel running conversion

config: {}

logging_overrides:
  pdfminer: WARNING
