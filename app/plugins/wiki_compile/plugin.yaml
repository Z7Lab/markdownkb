name: wiki_compile
display_name: Wiki Compile
description: Karpathy-style wiki compilation — create named, managed wikis and ingest source documents into them as LLM-synthesized summary pages with index.md + log.md per wiki.
version: 0.1.0
author: markdownkb
icon: book-open
category: synthesis
feature_flag: wiki_compile
requires: []

endpoints:
  - method: GET
    path: /api/wiki-compile/wikis
    description: List all managed wikis (name, path, page count, last ingest date)
  - method: POST
    path: /api/wiki-compile/wikis
    description: Create a managed wiki — auto-registers the path as a writable source and auto-mounts in Docker
  - method: DELETE
    path: /api/wiki-compile/wikis/{name}
    description: Deregister a managed wiki (the directory itself is not deleted)
  - method: POST
    path: /api/wiki-compile/ingest
    description: Ingest a source file into a managed wiki by name

dashboard_widget:
  enabled: true
  widget_type: recent_activity
  endpoint: /api/wiki-compile/wikis
  label: Wiki Activity
  empty_message: No wikis yet

config: {}
