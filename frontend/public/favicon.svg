<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="50" cy="50" r="45" fill="url(#grad)"/>

  <!-- Markdown "M" made of geometric shapes -->
  <g fill="white">
    <!-- Left vertical bar -->
    <rect x="25" y="30" width="8" height="40" rx="2"/>

    <!-- Middle vertical bar -->
    <rect x="46" y="30" width="8" height="40" rx="2"/>

    <!-- Right vertical bar -->
    <rect x="67" y="30" width="8" height="40" rx="2"/>

    <!-- Left diagonal connector -->
    <path d="M 29 30 L 50 50 L 46 54 L 25 34 Z" opacity="0.9"/>

    <!-- Right diagonal connector -->
    <path d="M 71 30 L 50 50 L 54 54 L 75 34 Z" opacity="0.9"/>

    <!-- Knowledge "book page" accent - small lines suggesting text -->
    <rect x="30" y="45" width="12" height="2" rx="1" opacity="0.7"/>
    <rect x="30" y="50" width="10" height="2" rx="1" opacity="0.7"/>
    <rect x="58" y="45" width="12" height="2" rx="1" opacity="0.7"/>
    <rect x="58" y="50" width="10" height="2" rx="1" opacity="0.7"/>
  </g>
</svg>
