services:
  mdkb:
    build: .
    ports:
      - "9713:9713"
    volumes:
      - mdkb-data:/app/data
      - ${MDKB_SOURCES:-./docs}:/app/docs
    environment:
      - MDKB_API_KEY=${MDKB_API_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:9713/api/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  mdkb-mcp:
    build: .
    command: python mcp_server.py --sse --host 0.0.0.0 --port 9715
    ports:
      - "9715:9715"
    volumes:
      - mdkb-data:/app/data
      - ${MDKB_SOURCES:-./docs}:/app/docs
    depends_on:
      mdkb:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mdkb-data:
