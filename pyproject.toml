[project]
name = "markdownkb"
version = "0.5.0"
description = "Chat with your docs — knowledge base with RAG"
requires-python = ">=3.11"
dependencies = [
    # Core
    "chromadb>=0.4.22,<2",
    "onnxruntime>=1.17.0,<2",
    "tokenizers>=0.15.0,<1",
    "anthropic>=0.40.0,<1",
    "openai>=1.50.0,<2",
    "pyyaml>=6.0.1,<7",
    "python-frontmatter>=1.1.0,<2",
    # File watching
    "watchdog>=4.0.0,<7",
    # Hybrid search
    "rank-bm25>=0.2.2,<1",
    # API
    "fastapi>=0.110.0,<1",
    "uvicorn>=0.27.0,<1",
    "slowapi>=0.1.9,<1",
    # MCP server
    "mcp>=1.0.0,<2",
    # Utilities
    "numpy>=1.24.0,<3",
    "httpx>=0.27.0,<1",
    "platformdirs>=4.0.0,<5",
    # Document conversion
    "markitdown>=0.1.0,<1",
    # Knowledge graph plugin
    "scikit-learn>=1.4.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<10",
    "pytest-asyncio>=0.23.0,<2",
    "pytest-cov>=5.0.0,<7",
    "mypy>=1.11.0,<2",
    "pip-audit>=2.7.0,<3",
]

[tool.pylint.design]
max-locals = 20
max-public-methods = 30
max-attributes = 10
max-args = 8
max-positional-arguments = 8
min-public-methods = 0

[tool.pylint.similarities]
min-similarity-lines = 10

[tool.pylint.variables]
# slowapi @limiter.limit() requires `request: Request` in FastAPI endpoint
# signatures — the decorator consumes it at runtime via inspection.
ignored-argument-names = "_.*|request"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=25"

[tool.coverage.run]
branch = true
source = ["app"]
omit = [
    "app/static/*",
    "app/skills/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = false
# First pass: only strict-check the app package (not tests) while the
# codebase migrates to fuller typing.
files = ["app"]
exclude = ["app/static/", "app/skills/"]
