services:
  mdkb:
    build: .
    container_name: ${MDKB_CONTAINER:-mdkb}
    ports:
      # Binds to localhost only by default — set MDKB_HOST=0.0.0.0 to expose
      - "${MDKB_HOST:-127.0.0.1}:${MDKB_PORT:-9713}:9713"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./skills:/app/skills
      # Mount home directory read-only so source paths in settings.yaml
      # work identically whether running with Docker or natively.
      # Add/remove source directories from the Settings UI — no restart needed.
      - ${HOME}:${HOME}:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - SERVER_HOST=0.0.0.0
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - VENICE_API_KEY=${VENICE_API_KEY:-}
      - OLLAMA_API_BASE=${OLLAMA_API_BASE:-}
      - MDKB_API_KEY=${MDKB_API_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:9713/api/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
