services:
  markdownkb:
    build: .
    container_name: ${MARKDOWNKB_CONTAINER:-markdownkb}
    ports:
      # Binds to localhost only by default — set MARKDOWNKB_HOST=0.0.0.0 to expose
      - "${MARKDOWNKB_HOST:-127.0.0.1}:${MARKDOWNKB_PORT:-9713}:9713"
    volumes:
      - ${MARKDOWNKB_DATA_DIR:-~/.local/share/markdownkb}:/data
      - ./config:/app/config
      # config/settings.yaml is read at startup; restart after editing it.
      - ./skills:/app/skills
      # Mount only the source directories your settings.yaml references.
      # Use :ro for read-only sources, omit for writable ones.
      # Add one line per source directory — do NOT mount your entire home dir.
      #
      # Example:
      #   - /home/user/docs:/home/user/docs:ro
      #   - /home/user/captures:/home/user/captures
      #
      # The paths must match what's in config/settings.yaml sources[].path.
      # Restart after changing mounts: make docker-down && make docker-up
    networks:
      - markdownkb-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - SERVER_HOST=0.0.0.0
      - OLLAMA_API_BASE=${OLLAMA_API_BASE:-}
      # API keys: use secrets/ files (preferred — not visible in docker inspect).
      # Add env vars here via compose.override.yml if you cannot use secrets files.
    secrets:
      - anthropic_api_key
      - openai_api_key
      - venice_api_key
      - markdownkb_api_key
    init: true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: "2.0"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9713/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  markdownkb-mcp:
    build: .
    container_name: ${MARKDOWNKB_CONTAINER:-markdownkb}-mcp
    command: python mcp_server.py --http --host 0.0.0.0 --port 9715
    ports:
      # MCP binds to localhost by default.  Set MARKDOWNKB_MCP_HOST=0.0.0.0
      # only when sandbox containers must reach it via host.docker.internal.
      - "${MARKDOWNKB_MCP_HOST:-127.0.0.1}:${MARKDOWNKB_MCP_PORT:-9715}:9715"
    volumes:
      - ${MARKDOWNKB_DATA_DIR:-~/.local/share/markdownkb}:/data
      - ./config:/app/config
      # Same source directory mounts as above (MCP needs read access for search).
      # Only the main service needs writable mounts for the write API.
    networks:
      - markdownkb-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OLLAMA_API_BASE=${OLLAMA_API_BASE:-}
    secrets:
      - anthropic_api_key
      - openai_api_key
      - venice_api_key
    init: true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "1.0"
    depends_on:
      markdownkb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('localhost',9715),timeout=5); s.sendall(b'GET /mcp HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n'); data=s.recv(64); s.close(); assert data.startswith(b'HTTP/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

networks:
  markdownkb-net:
    driver: bridge

# Docker secrets — create files in ./secrets/ with one key per file.
# Only the secrets that exist will be mounted; missing files cause a
# warning but don't prevent the container from starting.
secrets:
  anthropic_api_key:
    file: ./secrets/anthropic_api_key
  openai_api_key:
    file: ./secrets/openai_api_key
  venice_api_key:
    file: ./secrets/venice_api_key
  markdownkb_api_key:
    file: ./secrets/markdownkb_api_key
