services:
  markdownkb:
    build: .
    container_name: ${MARKDOWNKB_CONTAINER:-markdownkb}
    ports:
      # Binds to localhost only by default — set MARKDOWNKB_HOST=0.0.0.0 to expose
      - "${MARKDOWNKB_HOST:-127.0.0.1}:${MARKDOWNKB_PORT:-9713}:9713"
    volumes:
      - ${MARKDOWNKB_DATA_DIR:-~/.local/share/markdownkb}:/data
      - ./config:/app/config
      - ./skills:/app/skills
      # Mount home directory read-only so source paths in settings.yaml
      # work identically whether running with Docker or natively.
      # Add/remove source directories from the Settings UI — no restart needed.
      - ${HOME}:${HOME}:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - SERVER_HOST=0.0.0.0
      - OLLAMA_API_BASE=${OLLAMA_API_BASE:-}
      # API keys: secrets/ files (preferred) or env vars (convenience).
      # Docker secrets are NOT visible in `docker inspect`.
      # Env vars below ARE visible — use secrets/ for shared/production hosts.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - VENICE_API_KEY=${VENICE_API_KEY:-}
      - MARKDOWNKB_API_KEY=${MARKDOWNKB_API_KEY:-}
    secrets:
      - anthropic_api_key
      - openai_api_key
      - venice_api_key
      - markdownkb_api_key
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:9713/api/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  markdownkb-mcp:
    build: .
    container_name: ${MARKDOWNKB_CONTAINER:-markdownkb}-mcp
    command: python mcp_server.py --sse --host 0.0.0.0 --port 9715
    ports:
      # MCP binds to localhost by default.  Set MARKDOWNKB_MCP_HOST=0.0.0.0
      # only when sandbox containers must reach it via host.docker.internal.
      - "${MARKDOWNKB_MCP_HOST:-127.0.0.1}:${MARKDOWNKB_MCP_PORT:-9715}:9715"
    volumes:
      - ${MARKDOWNKB_DATA_DIR:-~/.local/share/markdownkb}:/data
      - ./config:/app/config
      - ${HOME}:${HOME}:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OLLAMA_API_BASE=${OLLAMA_API_BASE:-}
    secrets:
      - anthropic_api_key
      - openai_api_key
      - venice_api_key
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('localhost',9715),timeout=5); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

# Docker secrets — create files in ./secrets/ with one key per file.
# Only the secrets that exist will be mounted; missing files cause a
# warning but don't prevent the container from starting.
secrets:
  anthropic_api_key:
    file: ./secrets/anthropic_api_key
  openai_api_key:
    file: ./secrets/openai_api_key
  venice_api_key:
    file: ./secrets/venice_api_key
  markdownkb_api_key:
    file: ./secrets/markdownkb_api_key
