services:
  mdkb:
    build: .
    container_name: ${MDKB_CONTAINER:-mdkb}
    ports:
      # Binds to localhost only by default — set MDKB_HOST=0.0.0.0 to expose
      - "${MDKB_HOST:-127.0.0.1}:${MDKB_PORT:-9713}:9713"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./skills:/app/skills
      # Mount home directory read-only so source paths in settings.yaml
      # work identically whether running with Docker or natively.
      # Add/remove source directories from the Settings UI — no restart needed.
      - ${HOME}:${HOME}:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - SERVER_HOST=0.0.0.0
      - OLLAMA_API_BASE=${OLLAMA_API_BASE:-}
    secrets:
      - anthropic_api_key
      - openai_api_key
      - venice_api_key
      - mdkb_api_key
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:9713/api/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  mdkb-mcp:
    build: .
    container_name: ${MDKB_CONTAINER:-mdkb}-mcp
    command: python mcp_server.py --sse --host 0.0.0.0 --port 9715
    ports:
      - "${MDKB_HOST:-127.0.0.1}:${MDKB_MCP_PORT:-9715}:9715"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ${HOME}:${HOME}:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OLLAMA_API_BASE=${OLLAMA_API_BASE:-}
    secrets:
      - anthropic_api_key
      - openai_api_key
      - venice_api_key
    restart: unless-stopped

# Docker secrets — create files in ./secrets/ with one key per file.
# Only the secrets that exist will be mounted; missing files cause a
# warning but don't prevent the container from starting.
secrets:
  anthropic_api_key:
    file: ./secrets/anthropic_api_key
  openai_api_key:
    file: ./secrets/openai_api_key
  venice_api_key:
    file: ./secrets/venice_api_key
  mdkb_api_key:
    file: ./secrets/mdkb_api_key
